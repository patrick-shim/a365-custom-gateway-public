name: Docker runtime validation

on:
  push:
    branches: [main, validation/readme-install]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Verify source layout and launcher
        shell: pwsh
        run: |
          ./tools/scripts/maintenance/Test-RepositoryLayout.ps1
          ./bootstrap/tests/Runtime.Directory.Tests.ps1
          chmod +x ./gateway
          ./gateway --help
          if ($LASTEXITCODE -ne 0) { throw 'Launcher failed.' }

      - name: Build installer and runtime from public feeds
        shell: pwsh
        run: |
          dotnet build Gateway.slnx
          if ($LASTEXITCODE -ne 0) { throw '.NET build failed.' }
          npm --prefix web/setup ci
          if ($LASTEXITCODE -ne 0) { throw 'Setup restore failed.' }
          npm --prefix web/setup test
          if ($LASTEXITCODE -ne 0) { throw 'Setup tests failed.' }
          npm --prefix web/setup run build
          if ($LASTEXITCODE -ne 0) { throw 'Setup build failed.' }

      - name: Build Docker images with the bootstrap engine
        shell: pwsh
        run: |
          foreach ($module in @('Common', 'Experience', 'Prerequisites', 'Azure', 'Entra', 'Agent365', 'Runtime', 'RuntimePurview', 'Lifecycle')) {
            Import-Module "./bootstrap/modules/$module.psm1" -DisableNameChecking
          }
          $config = Get-Content bootstrap/config.example.runtime.json -Raw | ConvertFrom-Json
          Build-GatewayRuntimeImages -Config $config

      - name: Start isolated runtime with synthetic identity configuration
        shell: pwsh
        run: |
          foreach ($module in @('Common', 'Experience', 'Prerequisites', 'Azure', 'Entra', 'Agent365', 'Runtime', 'RuntimePurview', 'Lifecycle')) {
            Import-Module "./bootstrap/modules/$module.psm1" -DisableNameChecking
          }
          $config = Get-Content bootstrap/config.example.runtime.json -Raw | ConvertFrom-Json
          $config.runtime | Add-Member composeProjectName "gateway-validation-$env:GITHUB_RUN_ID"
          # These IDs cannot authorize Microsoft operations. Cloud execution is disabled.
          $identity = @{ gatewayApiClientId = '00000000-0000-4000-8000-000000000001'; gatewayApiTokenAudience = 'api://00000000-0000-4000-8000-000000000001' }
          $console = @{ consoleClientId = '00000000-0000-4000-8000-000000000002'; apiScope = 'api://00000000-0000-4000-8000-000000000001/access_as_user' }
          $workload = @{ workloadClientId = '00000000-0000-4000-8000-000000000003'; workloadServicePrincipalId = '00000000-0000-4000-8000-000000000004'; workloadClientSecret = 'synthetic-ci-value' }
          $images = @{ api = 'a365-gateway-api:dev'; worker = 'a365-gateway-worker:dev'; console = 'a365-gateway-console:dev' }
          $envFile = Write-GatewayRuntimeEnv -Config $config -Identity $identity -ConsoleIdentity $console -WorkloadIdentity $workload -Images $images -PromptShield @{ enabled = $false } -GatewayApiOboClientSecret 'synthetic-ci-value' -BlueprintClientSecret 'synthetic-ci-value' -BlueprintApplicationId '00000000-0000-4000-8000-000000000005'
          Deploy-GatewayRuntime -Config $config -EnvFile $envFile
          Test-GatewayRuntimeHealth -HealthUrl 'http://127.0.0.1:5080/health' -ReadyUrl 'http://127.0.0.1:5080/health/ready' -ConsoleConfigUrl 'http://127.0.0.1:5081/config.js' -ConsoleProxyHealthUrl 'http://127.0.0.1:5081/health'

      - name: Verify API documentation and authentication boundaries
        shell: pwsh
        run: |
          ./tools/scripts/diagnostics/Test-GatewayApiDocumentation.ps1
          foreach ($path in @('/docs', '/openapi/v1.json', '/openapi/v1.yaml')) {
            $response = Invoke-WebRequest "http://127.0.0.1:5081$path"
            if ($response.StatusCode -ne 200) { throw "Console route failed: $path" }
          }
          $response = Invoke-WebRequest 'http://127.0.0.1:5080/api/v1/agents' -SkipHttpErrorCheck
          if ($response.StatusCode -ne 401) { throw 'Unauthenticated administration was not rejected.' }
          $response = Invoke-WebRequest 'http://127.0.0.1:5080/api/v1/prompts:evaluate' -Method Post -ContentType 'application/json' -Body '{}' -SkipHttpErrorCheck
          if ($response.StatusCode -ne 401) { throw 'Unauthenticated agent ingress was not rejected.' }

      - name: Run real PostgreSQL and RabbitMQ regression checks
        env:
          GATEWAY_TEST_DB: Host=127.0.0.1;Port=5432;Database=gateway;Username=gateway;Password=gateway
          GATEWAY_TEST_RABBITMQ: amqp://gateway:gateway@127.0.0.1:5672/
        run: dotnet run --no-build --project tests/Gateway.RuntimeInfrastructure.Tests

      - name: Verify container replacement and retained database
        shell: bash
        run: |
          cd deploy/runtime
          dc=(docker compose --env-file .env.runtime -f docker-compose.yml -f docker-compose.apps.yml)
          "${dc[@]}" exec -T postgres psql -U gateway -d gateway -c 'CREATE TABLE validation_marker (value text); INSERT INTO validation_marker VALUES ('"'retained'"');'
          "${dc[@]}" up -d --force-recreate api worker console
          cd ../..
          pwsh -NoProfile -Command 'foreach ($module in @("Common", "Experience", "Prerequisites", "Azure", "Entra", "Agent365", "Runtime", "RuntimePurview", "Lifecycle")) { Import-Module "./bootstrap/modules/$module.psm1" -DisableNameChecking }; Test-GatewayRuntimeHealth -HealthUrl http://127.0.0.1:5080/health -ReadyUrl http://127.0.0.1:5080/health/ready -ConsoleConfigUrl http://127.0.0.1:5081/config.js -ConsoleProxyHealthUrl http://127.0.0.1:5081/health'
          cd deploy/runtime
          test "$("${dc[@]}" exec -T postgres psql -U gateway -d gateway -tAc 'SELECT value FROM validation_marker')" = retained

      - name: Verify S3 content storage
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: gateway
          AWS_SECRET_ACCESS_KEY: gatewaysecret
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          bucket="gateway-validation-${GITHUB_RUN_ID}"
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket "$bucket"
          printf 'synthetic content storage check' > "$RUNNER_TEMP/content.txt"
          aws --endpoint-url http://127.0.0.1:9000 s3api put-object --bucket "$bucket" --key validation.txt --body "$RUNNER_TEMP/content.txt"
          aws --endpoint-url http://127.0.0.1:9000 s3api get-object --bucket "$bucket" --key validation.txt "$RUNNER_TEMP/content-readback.txt"
          cmp "$RUNNER_TEMP/content.txt" "$RUNNER_TEMP/content-readback.txt"
          aws --endpoint-url http://127.0.0.1:9000 s3api delete-object --bucket "$bucket" --key validation.txt
          aws --endpoint-url http://127.0.0.1:9000 s3api delete-bucket --bucket "$bucket"

      - name: Verify worker credential directory access
        shell: bash
        run: |
          cd deploy/runtime
          dc=(docker compose --env-file .env.runtime -f docker-compose.yml -f docker-compose.apps.yml)
          "${dc[@]}" exec -T worker bash -c 'set -eu; test "$(id -u)" != 0; umask 077; printf synthetic > /app/blueprint-credentials/.validation-write'
          # Repeating preparation must preserve an existing credential file.
          pwsh -NoProfile -Command 'foreach ($module in @("Common", "Experience", "Prerequisites", "Azure", "Entra", "Agent365", "Runtime", "RuntimePurview", "Lifecycle")) { Import-Module "../../bootstrap/modules/$module.psm1" -DisableNameChecking }; $config = Get-Content ../../bootstrap/config.example.runtime.json -Raw | ConvertFrom-Json; Deploy-GatewayRuntime -Config $config -EnvFile (Join-Path (Get-Location) ".env.runtime")'
          "${dc[@]}" exec -T api bash -c 'set -eu; test "$(id -u)" != 0; test "$(cat /app/blueprint-credentials/.validation-write)" = synthetic; ! test -w /app/blueprint-credentials'
          "${dc[@]}" exec -T worker rm /app/blueprint-credentials/.validation-write

      - name: Show container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [ -f deploy/runtime/.env.runtime ]; then
            cd deploy/runtime
            docker compose --env-file .env.runtime -f docker-compose.yml -f docker-compose.apps.yml ps -a
            docker compose --env-file .env.runtime -f docker-compose.yml -f docker-compose.apps.yml logs --tail 80
          fi

      - name: Remove only this runner's disposable stack
        if: always()
        shell: bash
        run: |
          if [ -f deploy/runtime/.env.runtime ]; then
            cd deploy/runtime
            docker compose --env-file .env.runtime -f docker-compose.yml -f docker-compose.apps.yml down --volumes --remove-orphans
          fi
